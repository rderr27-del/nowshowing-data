# Rebuilds Now Showing's movie data from TMDB, Wikipedia and Wikidata every week and
# publishes it to GitHub Pages, where the app picks it up. Takes ~30 minutes. Needs the
# TMDB_API_KEY repository secret (see README).
name: Weekly data

on:
  schedule:
    - cron: "0 10 * * 1" # Mondays 10:00 UTC
  workflow_dispatch: # "Run workflow" button for an on-demand rebuild

permissions:
  contents: write # commit last-run.json and the awards fallback (keeps the schedule alive)
  pages: write
  id-token: write

concurrency:
  group: weekly-data
  cancel-in-progress: false

jobs:
  build:
    # Windows PowerShell 5.1, the same as the owner's PC, so the scripts run the same in both.
    runs-on: windows-latest
    timeout-minutes: 240
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
    steps:
      - uses: actions/checkout@v7

      - name: Check the TMDB key is set
        shell: powershell
        run: |
          if (-not $env:TMDB_API_KEY) { Write-Host "::error::Add your TMDB key as the TMDB_API_KEY repository secret (Settings > Secrets and variables > Actions)."; exit 1 }

      - name: Build catalog
        shell: powershell
        run: .\tools\build-catalog.ps1 -OutDir public

      # Wikipedia or Wikidata is occasionally slow, down or rate-limiting. Then last week's awards (kept in
      # history/awards.json) are published again instead of failing the whole run.
      - name: Build awards
        id: awards
        continue-on-error: true
        shell: powershell
        run: .\tools\build-awards.ps1 -OutDir public

      - name: Fall back to last week's awards
        if: steps.awards.outcome != 'success'
        shell: powershell
        run: |
          Write-Host "::warning::Awards build failed (Wikipedia or Wikidata); republishing last week's awards."
          Copy-Item history\awards.json public\awards.json

      - name: Rank Discover lists
        shell: powershell
        run: .\tools\build-discover.ps1 -OutDir public

      - name: Fetch movie details and US streaming
        shell: powershell
        run: .\tools\build-details.ps1 -OutDir public

      # No posters: since Nov 2026 the app loads them from TMDB's image server at the
      # size each screen needs, so the feed no longer copies or hosts them.
      - name: Package feed
        shell: powershell
        run: .\tools\build-feed.ps1 -OutDir public

      - name: Drop in-between files from the site
        shell: powershell
        run: |
          Remove-Item public\catalog.tsv, public\discover-pools.json, public\genres.json, public\providers.json

      - uses: actions/upload-artifact@v7
        with:
          name: feed
          path: public
          retention-days: 7

      # Commits last-run.json (GitHub disables scheduled workflows after 60 days
      # without repository activity) and this week's awards as next week's fallback.
      # A failed push only warns, so the site still deploys.
      - name: Record run
        shell: powershell
        run: |
          (Get-Content public\manifest.json -Raw) | Set-Content last-run.json -Encoding utf8
          New-Item -ItemType Directory -Force history | Out-Null
          Copy-Item public\awards.json history\awards.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add last-run.json history/awards.json
          git commit -m "Weekly data build" ; if ($LASTEXITCODE -ne 0) { exit 0 }
          git pull --rebase
          git push
          if ($LASTEXITCODE -ne 0) { Write-Host "::warning::Couldn't push last-run.json." }
          exit 0

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: feed
          path: public
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v5
